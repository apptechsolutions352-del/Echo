    <circle cx="600" cy="304" r="138" fill="none" stroke="#fff4eb" stroke-width="2" opacity=".5"/>
    <circle cx="600" cy="304" r="103" fill="none" stroke="#fff4eb" stroke-width="1.5" opacity=".5"/>
    <circle cx="600" cy="304" r="68" fill="none" stroke="#fff4eb" stroke-width="1.5" opacity=".5"/>
    <path d="M414 410c92-78 161 52 242-34s88-111 132-127" fill="none" stroke="#fff4eb" stroke-width="4" opacity=".8" stroke-linecap="round"/>
    <text x="600" y="450" fill="#fff4eb" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="4">SMALL HOURS</text>
    <text x="600" y="596" fill="#f1eff4" text-anchor="middle" font-size="27" font-weight="650">Midnight Windows</text>
