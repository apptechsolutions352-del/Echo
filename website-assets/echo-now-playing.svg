<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Echo Now Playing screen</title>
  <desc id="desc">A representative full-window Echo playback view with sample cover art, track details and transport controls.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#352340"/><stop offset=".5" stop-color="#242328"/><stop offset="1" stop-color="#173b3b"/></linearGradient>
    <linearGradient id="album" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaa5c4"/><stop offset=".48" stop-color="#8a5a9b"/><stop offset="1" stop-color="#263e5a"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="window"><rect width="1200" height="900" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#window)" font-family="Inter, Noto Sans, Arial, sans-serif">
    <rect width="1200" height="900" fill="#242328"/>
    <circle cx="220" cy="300" r="300" fill="#70466c" opacity=".28"/><circle cx="1060" cy="710" r="340" fill="#173b3b" opacity=".42"/>
