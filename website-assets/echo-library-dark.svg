    <linearGradient id="cover3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#df905d"/><stop offset="1" stop-color="#713b57"/></linearGradient>
    <clipPath id="window"><rect width="1440" height="900" rx="18"/></clipPath>
