<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Echo music library in dark mode</title>
  <desc id="desc">A representative Echo desktop interface showing a music library, navigation, track list and playback bar.</desc>
